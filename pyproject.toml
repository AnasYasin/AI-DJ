[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai_dj"
version = "0.0.1"
description = "AI powerd DJ style track mixing platform."
authors = [
  { name = "Anas Yasin" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["ai_dj"]
include = ["pyproject.toml", "ai_dj/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ai_dj"]
force-sort-within-sections = true


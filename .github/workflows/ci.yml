name: CI

# Only on the way into main. Feature branches (dev) push often and the suite
# needs ffmpeg, rubberband and model weights, so running it on every push was
# noise rather than signal.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check src/ tests/ scripts/ dags/ --output-format=github

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/ scripts/

      - name: Run tests
        run: pytest tests/ -v
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

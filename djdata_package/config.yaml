# djdata configuration. Every path is absolute or relative to the directory you run from.

source: raveform              # raveform | tracklists (the 1001tracklists path for DJs Raveform lacks)
root: data/djdata             # state db, downloaded audio, seam windows, outputs, logs
raveform_dir: data/raw/raveform/raveform
tracklists_csv: data/interim/tracklist.csv      # used when source is tracklists

# Which seams to run. Tiers are evaluated in order; a seam belongs to the first tier that matches.
run_tiers: [tier1]
tiers:
  tier1:
    djs: [adam beyer, armin van buuren, paul van dyk, markus schulz, aly & fila, charlotte de witte,
          carl cox, ferry corsten, calibre, roman flügel, dimension, hot since 82, fisher, noisia,
          solomun, andy c, tale of us]
    min_year: 2014
  tier2:
    genres: [Techno, House, Tech House, Trance, Drum & Bass, Progressive House, Deep House,
             Progressive Trance, Minimal, Deep Tech House]
    min_year: 2016

usable:                        # measured on the Raveform files, 2026-09-09
  min_match_rate: 0.5          # both tracks of the seam
  max_gap_s: 60                # Raveform mix-out of A may sit this far before mix-in of B
  min_year: 2014

workers:
  mix: 1                       # one mix worker; it waits while max_pending_mixes are still unanalysed
  tracks: 2                    # YouTube streams in parallel; the pace below is the real limit
  seams: 4                     # analysis processes (CPU bound, ~30 s per seam)
  max_pending_mixes: 4

download:
  mix_format: "bestaudio[protocol=http]/bestaudio"   # SoundCloud progressive mp3 first
  track_format: "bestaudio[ext=m4a]/bestaudio"
  cookies_file: null           # Netscape cookies file exported from an incognito YouTube login (see VM_SETUP.md)
  youtube_player_client: "default,web_embedded"   # verified from the VM 2026-09-13; the default client alone fails with cookies (issue 17389); needs deno + yt-dlp[default]
  min_interval_s: 20           # one track download start per 20 s across workers (180/h; yt-dlp wiki: guest limit ~300/h)
  block_wait_s: 900            # after a YouTube 403/429 block: pause all track downloads, probe every 15 min
  rotate_ip_on_block: false    # EC2 only: take a new Elastic IP when blocked. Needs an instance role with
                               # ec2:DescribeAddresses, AllocateAddress, AssociateAddress, ReleaseAddress.
                               # A blocked address was measured not to recover on its own (85 min, no lift).
  max_rotations: 25            # cap for the whole run, so a non-block fault cannot burn addresses all night
  block_probe_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"   # the probe video; any long-lived public video
  min_track_s: 120
  max_track_s: 1200

window:
  pad_s: 20                    # kept before the incoming track's first beat and after the outgoing track's last
  alone_s: 45                  # at least this much of each record alone, when the mix allows it

analysis:
  bands: [[20, 180], [180, 3000], [3000, 14000]]     # tested; six bands are a config change
  lam: 0.05                    # continuity pull between beats in the two-record fit
  local_ms: 8                  # per-beat local re-alignment range
  presence_db: -12             # a record counts as audible above this (low or mid band)

logging:
  level: INFO
